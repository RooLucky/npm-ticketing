openapi: 3.1.0
info:
  title: Quanby Ticketing API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: Version 1 of the connected ticketing API consumed by applications generated by
    `@quanby/ticketing`. All operations are scoped to the authenticated integration (`iss`) and
    requester (`sub`) from the bearer JWT.
servers:
  - url: /api/v1
    description: Relative to the configured ticketing service origin
security:
  - ticketingSession: []
tags:
  - name: Uploads
    description: Reserve private direct uploads before attaching them to a mutation.
  - name: Tickets
    description: Create and read requester-scoped tickets and replies.
paths:
  /uploads/presign:
    post:
      operationId: presignUpload
      summary: Create a short-lived direct-upload URL
      tags:
        - Uploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "201":
          description: Upload reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "413":
          $ref: "#/components/responses/FileTooLargeError"
  /tickets:
    get:
      operationId: listTickets
      summary: List the authenticated requester's tickets
      tags:
        - Tickets
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
      responses:
        "200":
          description: A cursor-paginated ticket page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createTicket
      summary: Create a ticket for the authenticated requester
      tags:
        - Tickets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/IdempotencyConflictError"
        "422":
          $ref: "#/components/responses/UploadStateError"
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Get one of the authenticated requester's tickets
      tags:
        - Tickets
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket detail with fresh private attachment links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /tickets/{ticketId}/replies:
    post:
      operationId: createTicketReply
      summary: Reply to one of the authenticated requester's tickets
      tags:
        - Tickets
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyRequest"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/IdempotencyConflictError"
        "422":
          $ref: "#/components/responses/UploadStateError"
components:
  securitySchemes:
    ticketingSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A 60-minute HS256 JWT. The protected `kid` and payload `iss` must both contain the
        integration client ID. The API resolves the shared secret from that ID. The audience must be
        `ticketing-api`.
      x-jwt-claims:
        $ref: "#/components/schemas/TicketingClaims"
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: ^tkt_[A-Za-z0-9_-]+$
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous response.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        default: 20
        type: integer
        minimum: 1
        maximum: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TicketStatus"
    CategoryFilter:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TicketCategory"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this mutation. Repeating a request with the same key and body returns
        the original result; reusing it with a different body returns `IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: ^[A-Za-z0-9._~:-]+$
        description: Unique mutation key. Identical replay returns the original result; reuse with a
          different body conflicts.
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The request is invalid.
                  fieldErrors:
                    title:
                      - Title must contain at least 3 characters.
    UnauthorizedError:
      description: Session is missing, invalid, or expired
      content: &a1
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The session does not include the required scope
      content: *a1
    NotFoundError:
      description: Resource not found for this requester
      content: *a1
    IdempotencyConflictError:
      description: The idempotency key was reused with a different request
      content: *a1
    UploadStateError:
      description: An upload is missing, incomplete, already attached, or belongs to another requester
      content: *a1
    FileTooLargeError:
      description: The requested upload exceeds the server limit
      content: *a1
  schemas:
    TicketingClaims:
      type: object
      properties:
        iss:
          type: string
          minLength: 1
          maxLength: 128
          description: Integration client ID; must equal the protected JWT kid.
        sub:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable requester ID in the consuming application.
        aud:
          anyOf:
            - type: string
              const: ticketing-api
            - minItems: 1
              type: array
              items:
                type: string
                const: ticketing-api
        name:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 128
        moduleName:
          type: string
          minLength: 1
          maxLength: 128
        pageUrl:
          $ref: "#/components/schemas/PageUrl"
        scopes:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/TicketingScope"
          uniqueItems: true
        iat:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Issued-at time in epoch seconds.
        exp:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Expiry in epoch seconds; must be after iat and no more than 3600 seconds later.
        jti:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - iss
        - sub
        - aud
        - name
        - sourceSystem
        - scopes
        - iat
        - exp
        - jti
      additionalProperties: {}
      description: Required JWT claims. exp must be after iat and no more than 3600 seconds later.
    TicketingScope:
      type: string
      enum:
        - tickets:read
        - tickets:create
        - tickets:reply
        - uploads:create
    TicketCategory:
      type: string
      enum:
        - bug
        - request
        - question
    TicketStatus:
      type: string
      enum:
        - open
        - in_progress
        - waiting_for_user
        - resolved
        - closed
    TicketId:
      type: string
      maxLength: 128
      pattern: ^tkt_[A-Za-z0-9_-]+$
    AttachmentId:
      type: string
      pattern: ^att_[A-Za-z0-9_-]+$
    ReplyId:
      type: string
      pattern: ^rpl_[A-Za-z0-9_-]+$
    PresignUploadRequest:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
        size:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
        - fileName
        - contentType
        - size
      additionalProperties: false
    PresignUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          pattern: ^upl_[A-Za-z0-9_-]+$
        uploadUrl:
          $ref: "#/components/schemas/PrivateTransferUrl"
        method:
          type: string
          const: PUT
        headers:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - uploadId
        - uploadUrl
        - method
        - headers
        - expiresAt
      additionalProperties: false
    CreateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 10000
        category:
          $ref: "#/components/schemas/TicketCategory"
        uploadIds:
          default: []
          maxItems: 5
          type: array
          items:
            type: string
            pattern: ^upl_[A-Za-z0-9_-]+$
          uniqueItems: true
      required:
        - title
        - description
        - category
      additionalProperties: false
    CreateReplyRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
        uploadIds:
          default: []
          maxItems: 5
          type: array
          items:
            type: string
            pattern: ^upl_[A-Za-z0-9_-]+$
          uniqueItems: true
      required:
        - message
      additionalProperties: false
    Reporter:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - id
        - name
      additionalProperties: false
    TicketSource:
      type: object
      properties:
        system:
          type: string
          minLength: 1
          maxLength: 128
        module:
          type: string
          minLength: 1
          maxLength: 128
        pageUrl:
          $ref: "#/components/schemas/PageUrl"
      required:
        - system
      additionalProperties: false
    PageUrl:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^(?:[hH][tT][tT][pP][sS]?:\/\/|\/(?!\/))[^\\]*$
      format: uri-reference
      description: An HTTP(S) URL or an origin-relative path such as `/support`.
    PrivateTransferUrl:
      type: string
      pattern: ^(?:[hH][tT][tT][pP][sS]:\/\/|[hH][tT][tT][pP]:\/\/(?:[lL][oO][cC][aA][lL][hH][oO][sS][tT]|127\.0\.0\.1|\[::1\])(?::[0-9]{1,5})?(?:\/|$))
      format: uri
      description: HTTPS URL; HTTP is permitted only for localhost loopback fixtures.
    Attachment:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AttachmentId"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        downloadUrl:
          $ref: "#/components/schemas/PrivateTransferUrl"
        downloadExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - fileName
        - contentType
        - size
        - downloadUrl
        - downloadExpiresAt
      additionalProperties: false
      description: Private attachment metadata with a short-lived download URL.
    ReplyAuthor:
      type: object
      properties:
        type:
          type: string
          enum:
            - requester
            - agent
        id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - type
        - id
        - name
      additionalProperties: false
    TicketReply:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ReplyId"
        message:
          type: string
          minLength: 1
          maxLength: 5000
        author:
          $ref: "#/components/schemas/ReplyAuthor"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - message
        - author
        - attachments
        - createdAt
      additionalProperties: false
    TicketSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TicketId"
        title:
          type: string
          minLength: 3
          maxLength: 160
        category:
          $ref: "#/components/schemas/TicketCategory"
        status:
          $ref: "#/components/schemas/TicketStatus"
        replyCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - title
        - category
        - status
        - replyCount
        - attachmentCount
        - createdAt
        - updatedAt
      additionalProperties: false
    Ticket:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TicketId"
        title:
          type: string
          minLength: 3
          maxLength: 160
        category:
          $ref: "#/components/schemas/TicketCategory"
        status:
          $ref: "#/components/schemas/TicketStatus"
        replyCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          type: string
          minLength: 1
          maxLength: 10000
        reporter:
          $ref: "#/components/schemas/Reporter"
        source:
          $ref: "#/components/schemas/TicketSource"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/TicketReply"
      required:
        - id
        - title
        - category
        - status
        - replyCount
        - attachmentCount
        - createdAt
        - updatedAt
        - description
        - reporter
        - source
        - attachments
        - replies
      additionalProperties: false
    TicketEnvelope:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
      required:
        - ticket
      additionalProperties: false
    ReplyEnvelope:
      type: object
      properties:
        reply:
          $ref: "#/components/schemas/TicketReply"
      required:
        - reply
      additionalProperties: false
    TicketPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketSummary"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - items
        - nextCursor
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_SESSION
        - SESSION_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - IDEMPOTENCY_CONFLICT
        - UPLOAD_NOT_READY
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - RATE_LIMITED
        - UPSTREAM_TIMEOUT
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            maxItems: 20
            type: array
            items:
              type: string
              maxLength: 500
        requestId:
          type: string
          maxLength: 128
      required:
        - code
        - message
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - error
      additionalProperties: false
